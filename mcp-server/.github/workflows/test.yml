name: MCP Server Tests

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'mcp-server/**'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'mcp-server/**'
  workflow_dispatch:

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Python dependencies
      working-directory: mcp-server
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install -r requirements-test.txt

    - name: Run linting
      working-directory: mcp-server
      run: |
        flake8 server.py test_server.py --max-line-length=100 --count --show-source --statistics

    - name: Run type checking
      working-directory: mcp-server
      run: |
        mypy server.py --ignore-missing-imports
      continue-on-error: true

    - name: Run tests with coverage
      working-directory: mcp-server
      run: |
        pytest --cov=server --cov-report=xml --cov-report=term-missing -v

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./mcp-server/coverage.xml
        flags: mcp-server
        name: mcp-server-coverage
        fail_ci_if_error: false

    - name: Generate coverage report
      working-directory: mcp-server
      if: always()
      run: |
        coverage report

  test-windows:
    name: Test on Windows
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      working-directory: mcp-server
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install -r requirements-test.txt

    - name: Run tests
      working-directory: mcp-server
      run: |
        pytest -v

  test-macos:
    name: Test on macOS
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        brew install gdal

    - name: Install Python dependencies
      working-directory: mcp-server
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install -r requirements-test.txt

    - name: Run tests
      working-directory: mcp-server
      run: |
        pytest -v
